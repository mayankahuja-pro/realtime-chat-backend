version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: chat_postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mayank123
      POSTGRES_DB: chat_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chat_redis
    restart: always

    ports:
      - "6379:6379"
  fastapi:
      build: .

      container_name: chat_backend

      depends_on:
        - postgres
        - redis

      env_file:
        - .env

      ports:
        - "8000:8000"

      volumes:
        - .:/app

      command: >
        uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload

volumes:
  postgres_data: